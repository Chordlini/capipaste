name: Capipaste
options:
  bundleIdPrefix: com.chordlini
  deploymentTarget:
    macOS: "26.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.7
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Capipaste:
    type: application
    platform: macOS
    sources: [Capipaste]
    dependencies:
      - package: FluidAudio
      - package: KeyboardShortcuts
      - package: mlx-swift-lm
        products: [MLXLLM, MLXLMCommon, MLXHuggingFace]
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    info:
      path: Capipaste/Info.plist
      properties:
        CFBundleDisplayName: Capipaste
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: Capipaste turns what you say into the note that goes with your screenshot. Audio never leaves your Mac.
        NSAppleEventsUsageDescription: Capipaste reads the address of the page you captured so the note says where the screenshot came from.
        NSSpeechRecognitionUsageDescription: Capipaste can use Apple's on-device speech model when no other model is downloaded.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chordlini.capipaste
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: TN6J66CQA6
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "26.0"
